<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#b5122b">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23071a3d'/%3E%3Cpath d='M32 52C13 39 9 30 13 21c4-9 16-8 19 0 3-8 15-9 19 0 4 9 0 18-19 31Z' fill='%23c41636'/%3E%3C/svg%3E">
  <title>Minha Cachinhos ❤️</title>
  <style>
    :root{--vermelho:#c41636;--vermelho-escuro:#790d24;--azul:#071a3d;--claro:#fff6f7}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 8%,rgba(196,22,54,.28),transparent 28%),linear-gradient(145deg,var(--azul),#030711 52%,var(--vermelho-escuro));color:white;font-family:Arial,sans-serif}
    .pagina{width:min(100%,820px);margin:auto;padding:14px 14px 28px}
    .topo{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 4px 16px}
    .marca{color:white;text-decoration:none;font-size:clamp(19px,5vw,28px);font-weight:800;text-shadow:0 2px 18px rgba(196,22,54,.65)}
    .atalho{display:grid;place-items:center;width:46px;height:46px;color:white;text-decoration:none;background:linear-gradient(135deg,var(--vermelho),var(--vermelho-escuro));border:1px solid rgba(255,255,255,.16);border-radius:50%;font-size:23px;font-weight:800;box-shadow:0 5px 16px rgba(196,22,54,.2);transition:.25s}
    .atalho:hover,.atalho:focus-visible{transform:translateY(-2px);background:var(--azul)}
    .historia{position:relative;display:block;overflow:hidden;margin-bottom:18px;border:2px solid transparent;border-radius:24px;background:linear-gradient(#08080c,#08080c) padding-box,linear-gradient(145deg,var(--vermelho),#e9354e 42%,var(--azul)) border-box;box-shadow:0 14px 38px rgba(0,0,0,.4),0 0 18px rgba(7,26,61,.28);transition:.25s}
    .historia::after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid rgba(255,255,255,.08);border-radius:20px}
    .historia:hover,.historia:focus-visible{transform:translateY(-2px);box-shadow:0 18px 44px rgba(0,0,0,.46),0 0 20px rgba(196,22,54,.2)}
    .historia img{display:block;width:100%;height:auto;filter:contrast(1.04) saturate(1.08)}
    .musica{scroll-margin-top:12px;position:relative;overflow:hidden;display:block;text-decoration:none;color:white;padding:24px;margin:0;border:1px solid rgba(255,255,255,.16);border-radius:22px;background:linear-gradient(135deg,var(--vermelho),var(--vermelho-escuro) 55%,var(--azul));box-shadow:0 12px 28px rgba(0,0,0,.32);transition:.25s}
    .musica::after{content:"♪";position:absolute;right:18px;top:4px;font-size:90px;color:rgba(255,255,255,.08);transform:rotate(-10deg);pointer-events:none}
    .musica:hover,.musica:focus-visible{transform:translateY(-3px);box-shadow:0 19px 42px rgba(196,22,54,.28)}
    .rotulo{display:block;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#dce7ff}
    .musica strong{display:block;font-size:clamp(25px,7vw,38px);margin:7px 0 4px}
    .artista{display:block;color:#f6dfe4;margin-bottom:18px}
    .ouvir{display:flex;align-items:center;justify-content:center;gap:9px;background:white;color:var(--azul);padding:14px;border-radius:999px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.2)}
    @media(max-width:520px){.pagina{padding:8px}.topo{padding:10px 4px 12px}.historia{border-radius:16px;margin-bottom:14px}.musica{border-radius:16px;padding:18px}}
  </style>
</head>
<body>
  <main class="pagina">
    <header class="topo">
      <a class="marca" href="#historia">Minha Cachinhos ❤️</a>
      <a class="atalho" href="#musica" aria-label="Ir para minha música" title="Minha música">♫</a>
    </header>

    <a class="historia" id="historia" href="#musica" aria-label="Ver nossa história e ir para a música">
      <img src="imagem.jpg" alt="Nossa história, fotos e declaração para minha cachinhos">
    </a>
    <a class="musica" id="musica" href="https://open.spotify.com/track/2w6746fLRqE8Sl7I3w9NYI" target="_blank" rel="noopener">
      <span class="rotulo">♫ minha música pra vc</span>
      <strong>Escolhas — Ao Vivo</strong>
      <span class="artista">Zé Neto &amp; Cristiano</span>
      <span class="ouvir">▶ Ouvir no Spotify</span>
    </a>
  </main>
</body>
</html>
